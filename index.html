<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Green Horizon</title>
  <style>
    :root{color-scheme:light dark}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#f4f7f5;color:#17211b}
    main{width:min(680px,calc(100% - 40px));padding:44px;border:1px solid #dfe7e1;border-radius:18px;background:#fff;box-shadow:0 12px 35px rgba(0,0,0,.06)}
    h1{margin:0 0 12px;font-size:30px;font-weight:650;letter-spacing:-.02em}
    p{margin:0;color:#5a675f}
    .dot{display:inline-block;width:9px;height:9px;margin-right:9px;border-radius:50%;background:#4c8f68}
    @media(prefers-color-scheme:dark){body{background:#111714;color:#e6eee9}main{background:#18211c;border-color:#2a3730}p{color:#9fb0a6}}
  </style>
</head>
<body>
  <main>
    <h1>Green Horizon</h1>
    <p><span class="dot"></span>Service is online.</p>
  </main>
</body>
</html>
